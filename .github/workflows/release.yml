name: Release

on:
  workflow_run:
    workflows: ['Test']
    branches: [main, rc]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      # `main` publishes stable versions, `rc` publishes prereleases.
      RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Generate Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build library
        run: pnpm build

      - name: Get version before release
        id: pre_release
        run: echo "version=$(node -p "require('./lib/package.json').version")" >> $GITHUB_OUTPUT

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
        # A `workflow_run` job always runs on the default branch, so GITHUB_REF
        # says `main` no matter which branch triggered the Test run.
        # semantic-release reads it (through env-ci) to decide which branch it is
        # releasing, so it has to be pointed at the branch actually checked out —
        # otherwise an `rc` run releases as `main` and dies in `git tag --merged
        # main`, a ref it never fetched locally.
        #
        # Assigned on the command line rather than under `env:` above: the runner
        # supplies its own `GITHUB_*` defaults and an `env:` entry doesn't displace
        # them, whereas a shell assignment applies at exec time and does.
        run: GITHUB_REF="refs/heads/$RELEASE_BRANCH" npx semantic-release

      - name: Get version after release
        id: post_release
        run: |
          VERSION=$(node -p "require('./lib/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "dist_tag=$(node ./scripts/npm-dist-tag.mjs "$VERSION")" >> $GITHUB_OUTPUT

      # semantic-release picks its release config by the branch env-ci reports, so a
      # run that misidentifies its branch releases on the wrong channel — an `rc`
      # run believing it is `main` would put prerelease content on `latest`. The
      # dist-tag is derived from the version, so holding it against the branch
      # catches that before anything reaches npm.
      - name: Check the dist-tag matches the branch
        if: steps.pre_release.outputs.version != steps.post_release.outputs.version
        env:
          VERSION: ${{ steps.post_release.outputs.version }}
          DIST_TAG: ${{ steps.post_release.outputs.dist_tag }}
        run: |
          set -euo pipefail

          # Prerelease branches publish under their own name (`rc` -> `rc`), which
          # is also the preid release.config.js gives them.
          if [ "$RELEASE_BRANCH" = 'main' ]; then
            EXPECTED=latest
          else
            EXPECTED="$RELEASE_BRANCH"
          fi

          if [ "$DIST_TAG" != "$EXPECTED" ]; then
            echo "::error::Refusing to publish $VERSION from $RELEASE_BRANCH — that lands on the '$DIST_TAG' npm tag, expected '$EXPECTED'."
            exit 1
          fi

          echo "\`$VERSION\` from \`$RELEASE_BRANCH\` publishes to the \`$DIST_TAG\` npm tag, as expected." >> $GITHUB_STEP_SUMMARY

      - name: Copy docs to package
        if: steps.pre_release.outputs.version != steps.post_release.outputs.version
        run: cp README.md LICENSE CHANGELOG.md lib/

      - name: Publish to npm
        if: steps.pre_release.outputs.version != steps.post_release.outputs.version
        working-directory: lib
        run: npm publish --provenance --access public --tag ${{ steps.post_release.outputs.dist_tag }}

      - name: Summary
        if: steps.pre_release.outputs.version != steps.post_release.outputs.version
        run: |
          echo "Published \`react-arven@${{ steps.post_release.outputs.version }}\` under the \`${{ steps.post_release.outputs.dist_tag }}\` npm tag." >> $GITHUB_STEP_SUMMARY

      # semantic-release resolves the last release with `git tag --merged <branch>`,
      # and a stable tag sits on the `chore(release)` commit — a child of the merge
      # commit, so never reachable from `rc`. Left behind, `rc` keeps numbering its
      # prereleases from the previous stable version and publishes an `x.y.z-rc.N`
      # that `latest` has already superseded. Nothing errors; the rc channel just
      # goes quietly wrong. So `rc` gets caught up as part of the release.
      - name: Sync rc with main
        if: env.RELEASE_BRANCH == 'main'
        run: |
          set -euo pipefail

          MAIN=$(git rev-parse HEAD)
          git fetch origin +refs/heads/rc:refs/remotes/origin/rc

          if git merge-base --is-ancestor origin/rc "$MAIN"; then
            git push origin "$MAIN":refs/heads/rc
            echo "Fast-forwarded \`rc\` to \`main\`." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # `rc` picked up commits while `main` was releasing, so catching it up
          # takes a real merge. `[skip ci]` keeps this from publishing a prerelease
          # off an automated merge — the next merge into `rc` does that, now
          # numbered from the stable version that just shipped.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B rc origin/rc

          if ! git merge --no-edit -m 'chore: merge main into rc [skip ci]' "$MAIN"; then
            git merge --abort
            {
              echo "### Couldn't sync \`rc\` with \`main\`"
              echo
              echo "The release published, but merging \`main\` into \`rc\` conflicts."
              echo "Merge it by hand — until then \`rc\` numbers its prereleases from the"
              echo "stable version before this one and publishes versions \`latest\` already has."
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          git push origin rc
          echo "Merged \`main\` into \`rc\`." >> $GITHUB_STEP_SUMMARY
